name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: [ main ]

# 🛑 ADD THIS PERMISSIONS BLOCK HERE 🛑
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
